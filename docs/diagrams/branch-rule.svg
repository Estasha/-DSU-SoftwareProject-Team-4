<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" width="820" height="270" role="img" aria-label="feature 브랜치는 dev에서 갈라져 나와 PR로 dev에 합쳐지고, dev는 주기적으로 main에 합쳐진다는 구조를 보여주는 다이어그램">
  <rect x="0" y="0" width="820" height="270" rx="12" fill="#FFFFFF"/>
  <defs>
    <marker id="r-main" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#2E5AAC"/>
    </marker>
    <marker id="r-dev" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#147A63"/>
    </marker>
  </defs>

  <line x1="40" y1="60" x2="780" y2="60" stroke="#2E5AAC" stroke-width="2.5"/>
  <text x="18" y="55" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2E5AAC">main</text>
  <text x="18" y="70" font-family="Arial, sans-serif" font-size="11" fill="#5B6472">배포 가능한 상태</text>

  <line x1="40" y1="160" x2="780" y2="160" stroke="#147A63" stroke-width="2.5"/>
  <text x="18" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#147A63">dev</text>
  <text x="18" y="170" font-family="Arial, sans-serif" font-size="11" fill="#5B6472">통합 브랜치</text>

  <path d="M 320 160 L 320 62" fill="none" stroke="#2E5AAC" stroke-width="2" marker-end="url(#r-main)"/>
  <text x="326" y="115" font-family="Consolas, monospace" font-size="11" fill="#5B6472">PR → main</text>
  <text x="326" y="128" font-family="Consolas, monospace" font-size="11" fill="#5B6472">(주기적 배포)</text>

  <path d="M 640 160 L 640 62" fill="none" stroke="#2E5AAC" stroke-width="2" marker-end="url(#r-main)"/>
  <circle cx="640" cy="60" r="4" fill="#2E5AAC"/>

  <circle cx="110" cy="160" r="4" fill="#147A63"/>
  <path d="M 110 160 C 120 210, 140 250, 170 250 L 210 250 C 240 250, 260 210, 270 162"
        fill="none" stroke="#B96A16" stroke-width="2" marker-end="url(#r-dev)"/>
  <circle cx="190" cy="250" r="4" fill="#B96A16"/>
  <text x="110" y="225" font-family="Consolas, monospace" font-size="11" fill="#5B6472">checkout -b feature/*</text>
  <text x="150" y="266" font-family="Consolas, monospace" font-size="11" fill="#B96A16">feature/역할-기능명</text>

  <circle cx="430" cy="160" r="4" fill="#147A63"/>
  <path d="M 430 160 C 440 210, 460 250, 490 250 L 530 250 C 560 250, 580 210, 590 162"
        fill="none" stroke="#B96A16" stroke-width="2" marker-end="url(#r-dev)"/>
  <circle cx="510" cy="250" r="4" fill="#B96A16"/>
  <text x="596" y="220" font-family="Consolas, monospace" font-size="11" fill="#5B6472">PR → dev</text>

  <text x="700" y="248" font-family="Arial, sans-serif" font-size="11" fill="#5B6472">← 팀원마다 반복</text>
</svg>
