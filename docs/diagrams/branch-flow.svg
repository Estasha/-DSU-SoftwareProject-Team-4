<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" width="820" height="230" role="img" aria-label="feature 브랜치가 main에서 갈라져 나와 PR을 거쳐 다시 main으로 바로 합쳐지는 구조를 보여주는 다이어그램">
  <rect x="0" y="0" width="820" height="230" rx="12" fill="#FFFFFF"/>
  <defs>
    <marker id="f-main" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#2E5AAC"/>
    </marker>
  </defs>

  <line x1="40" y1="60" x2="780" y2="60" stroke="#2E5AAC" stroke-width="2.5"/>
  <text x="18" y="55" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2E5AAC">main</text>
  <text x="18" y="70" font-family="Arial, sans-serif" font-size="11" fill="#5B6472">배포 가능한 상태 · PR로만 반영</text>

  <!-- feature loop A -->
  <circle cx="120" cy="60" r="4" fill="#2E5AAC"/>
  <path d="M 120 60 C 130 120, 150 160, 180 160 L 220 160 C 250 160, 270 120, 280 62"
        fill="none" stroke="#B96A16" stroke-width="2" marker-end="url(#f-main)"/>
  <circle cx="200" cy="160" r="4" fill="#B96A16"/>
  <text x="120" y="140" font-family="Consolas, monospace" font-size="11" fill="#5B6472">checkout -b feature/*</text>
  <text x="160" y="178" font-family="Consolas, monospace" font-size="11" fill="#B96A16">feature/역할-기능명</text>
  <text x="286" y="130" font-family="Arial, sans-serif" font-size="11" fill="#5B6472">PR → main</text>

  <!-- feature loop B -->
  <circle cx="440" cy="60" r="4" fill="#2E5AAC"/>
  <path d="M 440 60 C 450 120, 470 160, 500 160 L 540 160 C 570 160, 590 120, 600 62"
        fill="none" stroke="#B96A16" stroke-width="2" marker-end="url(#f-main)"/>
  <circle cx="520" cy="160" r="4" fill="#B96A16"/>
  <text x="606" y="130" font-family="Arial, sans-serif" font-size="11" fill="#5B6472">PR → main</text>

  <text x="680" y="200" font-family="Arial, sans-serif" font-size="11" fill="#5B6472">← 팀원마다 반복</text>
</svg>
