<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="main에 직행 머지되던 PR 2번과 3번 이후 4e75a09 지점에서 dev 브랜치가 새로 만들어졌고, 지금은 dev에서 갈라진 feature/pm-readme-tutorial 브랜치가 PR 4번으로 dev에 합쳐지길 기다리는 중이며, 이후 dev가 주기적으로 main에 합쳐질 예정임을 보여주는 다이어그램">
  <rect x="0" y="0" width="920" height="400" rx="12" fill="#FFFFFF"/>
  <defs>
    <marker id="h-main" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
