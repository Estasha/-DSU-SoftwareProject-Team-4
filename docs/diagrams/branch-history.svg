    <rect x="90" y="14" width="14" height="3" fill="#147A63"/><text x="108" y="20">dev</text>
    <rect x="155" y="14" width="14" height="3" fill="#B96A16"/><text x="173" y="20">feature</text>
    <text x="250" y="20">실선 = 머지 완료 · 점선 = 대기/예정</text>
  </g>

  <line x1="50" y1="50" x2="860" y2="50" stroke="#2E5AAC" stroke-width="2.5"/>
  <text x="20" y="45" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2E5AAC">main</text>

  <circle cx="60" cy="50" r="4.5" fill="#2E5AAC"/>
  <text x="60" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1B1F24">first</text>
  <text x="60" y="78" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#5B6472">bdccf22</text>

