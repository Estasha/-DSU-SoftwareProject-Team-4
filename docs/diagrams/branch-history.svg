  <text x="662" y="180" font-family="Arial, sans-serif" font-size="11" fill="#B96A16">PR #4 → dev</text>
  <text x="662" y="194" font-family="Arial, sans-serif" font-size="10.5" fill="#5B6472">(리뷰 대기 중)</text>

  <line x1="760" y1="20" x2="760" y2="340" stroke="#5B6472" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.6"/>
  <text x="768" y="34" font-family="Arial, sans-serif" font-size="11" fill="#5B6472">지금</text>

  <path d="M 850 190 L 850 62" fill="none" stroke="#2E5AAC" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.55" marker-end="url(#h-main)"/>
  <text x="720" y="145" font-family="Arial, sans-serif" font-size="10.5" fill="#5B6472" opacity="0.85">다음 단계: dev → main PR</text>
