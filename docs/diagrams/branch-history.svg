  <text x="380" y="108" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#B96A16">feature/pm-docs-turso-update</text>
  <text x="380" y="78" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#5B6472">4e75a09</text>

  <line x1="380" y1="50" x2="860" y2="50" stroke="#2E5AAC" stroke-width="2.5"/>

  <path d="M 380 50 C 400 50, 400 190, 420 190" fill="none" stroke="#147A63" stroke-width="2.5"/>
  <line x1="420" y1="190" x2="860" y2="190" stroke="#147A63" stroke-width="2.5"/>
